<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Engine2 — Ground Compare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/game/ui/cursor.css">
<script src="/game/ui/cursor.js" defer></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #f0f0f0; font: 13px/1.3 "Figtree", system-ui, sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #bar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; z-index: 2; }
  #bar a, #bar button { background: #1c1c1c; color: #f0f0f0; border: 1px solid #4a4a4a; border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; text-decoration: none; }
  #bar button.on { border-color: #c9a227; color: #c9a227; }
  #bar .sep { width: 10px; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .label { position: absolute; left: 0; top: 0; padding: 2px 6px; background: rgba(17,17,17,.75); border: 1px solid #4a4a4a; border-radius: 3px; white-space: nowrap; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div id="bar">
  <a href="/game.html?start=test" aria-label="Voltar">‹ Voltar</a>
  <span class="sep"></span>
  <button data-source="claude" class="on">Claude</button>
  <button data-source="gpt">GPT</button>
  <button data-source="proto">Protótipo</button>
  <span class="sep"></span>
  <button data-tod="day" class="on">Dia</button>
  <button data-tod="dusk">Entardecer</button>
  <button data-tod="brightNight">Noite clara</button>
  <button data-tod="darkNight">Noite escura</button>
  <span class="sep"></span>
  <button id="reset" title="Voltar ao ângulo normal">Reset</button>
</div>
<script type="module" src="/src/ground-compare/main.ts"></script>
</body>
</html>
